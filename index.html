<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>꼬마 국기 탐험대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one centered play column; a "flagpole" stage on top, big answer tiles below, dot trail for progress */
:root {
  --bg: #E9F1F7;
  --surface: #FFFFFF;
  --ink: #1C2A3A;
  --muted: #5B6B7D;
  --line: #CBD8E4;
  --accent: #2F6FDE;
  --accent-ink: #FFFFFF;
  --sun: #FFC93C;
  --good: #1E9E5A;
  --good-bg: #DDF5E7;
  --bad: #D9443A;
  --bad-bg: #FBE3E0;
  --pole: #9AA9B8;
  --display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121B26; --surface: #1C2836; --ink: #EAF1F8; --muted: #9FB0C2; --line: #2F3F51;
  --accent: #6FA0FF; --accent-ink: #0E1724; --sun: #FFD266; --good: #4FD18B; --good-bg: #173A2A;
  --bad: #FF7A70; --bad-bg: #42201E; --pole: #56677A; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121B26; --surface: #1C2836; --ink: #EAF1F8; --muted: #9FB0C2; --line: #2F3F51;
  --accent: #6FA0FF; --accent-ink: #0E1724; --sun: #FFD266; --good: #4FD18B; --good-bg: #173A2A;
  --bad: #FF7A70; --bad-bg: #42201E; --pole: #56677A; color-scheme: dark; }
html, body { min-height: 100%; }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
img { max-width: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; word-break: keep-all; }
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, .display { font-family: var(--display); font-weight: 400; text-wrap: balance; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.flag > img { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 4px; box-shadow: 0 0 0 1px rgba(0,0,0,.12); background: var(--line); }
.credit { text-align: center; color: var(--muted); font-size: .8rem; margin: 8px 0 0; }
.credit a { color: inherit; }

/* Top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 { font-size: 1.6rem; }
.brand .mini { width: 34px; }
.iconbtn { background: var(--surface); border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; font-family: var(--display); font-size: 1rem; }

/* Home */
.hero { background: var(--surface); border-radius: 22px; padding: 22px; display: grid; gap: 16px; border: 2px solid var(--line); }
.hero p { margin: 0; color: var(--muted); line-height: 1.6; }
.parade { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.label { font-family: var(--display); font-size: 1.05rem; margin-bottom: 8px; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 14px; text-align: left; display: grid; gap: 4px; }
.opt b { font-family: var(--display); font-weight: 400; font-size: 1.2rem; }
.opt span { color: var(--muted); font-size: .9rem; }
.opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.go { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 18px; padding: 16px; font-family: var(--display); font-size: 1.5rem; box-shadow: 0 5px 0 color-mix(in srgb, var(--accent) 60%, #000); transition: transform .08s; }
.go:active { transform: translateY(3px); box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 60%, #000); }
.ghost { background: transparent; border: 2px solid var(--line); border-radius: 18px; padding: 12px; font-family: var(--display); font-size: 1.1rem; }

/* Play */
.status { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.trail { display: flex; gap: 6px; flex-wrap: wrap; }
.trail i { width: 16px; height: 16px; border-radius: 50%; background: var(--line); display: block; }
.trail i.ok { background: var(--good); } .trail i.no { background: var(--bad); } .trail i.now { box-shadow: 0 0 0 3px var(--accent); background: var(--surface); }
.score { font-family: var(--display); font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.score .streak { color: var(--bad); margin-left: 8px; }
.stage { position: relative; background: var(--surface); border-radius: 22px; border: 2px solid var(--line); padding: 22px 22px 22px 46px; display: grid; gap: 14px; }
.stage::before { content: ""; position: absolute; left: 24px; top: 16px; bottom: 16px; width: 6px; border-radius: 3px; background: var(--pole); }
.stage::after { content: ""; position: absolute; left: 20px; top: 10px; width: 14px; height: 14px; border-radius: 50%; background: var(--sun); }
.q { font-family: var(--display); font-size: 1.35rem; }
.bigflag { max-width: 420px; transform-origin: left center; animation: raise .5s ease-out; }
.bigname { font-family: var(--display); font-size: clamp(2.2rem, 9vw, 3.4rem); color: var(--accent); animation: raise .5s ease-out; }
.still { animation: none; }
@keyframes raise { from { transform: translateY(18px); opacity: .3; } to { transform: none; opacity: 1; } }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ans { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 16px 10px; font-family: var(--display); font-size: 1.35rem; min-height: 64px; box-shadow: 0 4px 0 var(--line); transition: transform .08s; }
.ans:hover:not(:disabled) { border-color: var(--accent); }
.ans:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 var(--line); }
.ans.flagans { padding: 10px; }
.ans.right { background: var(--good-bg); border-color: var(--good); box-shadow: 0 4px 0 var(--good); animation: pop .35s; }
.ans.wrong { background: var(--bad-bg); border-color: var(--bad); box-shadow: 0 4px 0 var(--bad); animation: shake .35s; }
.ans:disabled { cursor: default; }
.ans.dim { opacity: .45; }
@keyframes pop { 50% { transform: scale(1.06); } }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.feedback { border-radius: 18px; padding: 14px 16px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.feedback.good { background: var(--good-bg); } .feedback.bad { background: var(--bad-bg); }
.feedback .msg { display: grid; gap: 4px; min-width: 0; }
.feedback .msg b { font-family: var(--display); font-weight: 400; font-size: 1.35rem; }
.feedback.good .msg b { color: var(--good); } .feedback.bad .msg b { color: var(--bad); }
.feedback .fact { color: var(--ink); line-height: 1.5; }
.next { background: var(--ink); color: var(--bg); border: 0; border-radius: 14px; padding: 12px 20px; font-family: var(--display); font-size: 1.2rem; }

/* Result */
.result { text-align: center; display: grid; gap: 16px; background: var(--surface); border: 2px solid var(--line); border-radius: 22px; padding: 26px 20px; }
.stars { font-size: 3rem; letter-spacing: 6px; color: var(--sun); line-height: 1; }
.stars .off { color: var(--line); }
.result .big { font-family: var(--display); font-size: 2.6rem; font-variant-numeric: tabular-nums; }
.result p { margin: 0; color: var(--muted); }
.missed { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; text-align: left; }
.missed figure, .dex figure { margin: 0; display: grid; gap: 6px; }
.missed figcaption, .dex figcaption { font-family: var(--display); font-size: 1.05rem; }
.dex figcaption small { display: block; font-family: var(--body); color: var(--muted); font-size: .82rem; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.row > * { flex: 1 1 180px; }

/* Dex */
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tab { background: var(--surface); border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; font-family: var(--display); }
.tab[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.dex { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 16px; }
.dex figure { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 10px; }
.dex figure.seen { border-color: var(--good); }
.note { color: var(--muted); font-size: .92rem; margin: 0; }

@media (max-width: 420px) {
  .choices.three { grid-template-columns: 1fr; }
  .ans { font-size: 1.15rem; }
  .stage { padding: 18px 16px 18px 40px; }
  .stage::before { left: 18px; } .stage::after { left: 14px; }
}
.choices.three { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.tab small { margin-left: 6px; font-family: var(--body); opacity: .7; font-size: .8rem; }
.chip { justify-self: start; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: .85rem; color: var(--muted); }
.answers.conts .ans { font-size: 1.2rem; }
.missed figcaption small { display: block; font-family: var(--body); color: var(--muted); font-size: .82rem; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

function beep(ok) {
  if (!ST.sound) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const notes = ok ? [660, 880] : [300, 220];
    notes.forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = ok ? 'triangle' : 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, audio.currentTime + i * .12);
      g.gain.exponentialRampToValueAtTime(ok ? .25 : .08, audio.currentTime + i * .12 + .02);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + i * .12 + .18);
      o.connect(g).connect(audio.destination); o.start(audio.currentTime + i * .12); o.stop(audio.currentTime + i * .12 + .2);
    });
  } catch {}
}

let G;
function startGame() {
  const p = shuffle(pool());
  const n = Math.min(10, p.length);
  G = { qs: p.slice(0, n), total: n, i: 0, score: 0, streak: 0, results: [], missed: [], answered: false };
  makeQuestion(); ST.view = 'play'; renderPlay();
  window.scrollTo(0, 0);
}
function makeQuestion() {
  const target = G.qs[G.i];
  G.answered = false; G.picked = null;
  if (ST.mode === 'flag2cont') { G.options = CONTS.slice(); return; }
  const L = LEVELS[ST.level];
  const p = pool();
  let picks = [];
  if (L.twins) {
    // look-alikes from anywhere in the world make it harder, even inside one continent
    picks = shuffle((TWINS[target.code] || []).map(k => BY[k]).filter(Boolean)).slice(0, L.twins);
    // in hard mode, prefer the same continent for the rest
    if (ST.level === 'hard') shuffle(COUNTRIES.filter(c => c.cont === target.cont && c !== target)).forEach(c => { if (picks.length < L.opts - 1 && !picks.includes(c)) picks.push(c); });
  }
  shuffle(p.filter(c => c !== target)).forEach(c => { if (picks.length < L.opts - 1 && !picks.includes(c)) picks.push(c); });
  shuffle(COUNTRIES.filter(c => c !== target)).forEach(c => { if (picks.length < L.opts - 1 && !picks.includes(c)) picks.push(c); });
  G.options = shuffle([target, ...picks]);
}

  };
  const rightKey = ST.mode === 'flag2cont' ? t.cont : t.code;
  const answers = G.options.map((o, k) => {
    const key = ST.mode === 'flag2cont' ? o : o.code;
    let cls = 'ans' + (ST.mode === 'name2flag' ? ' flagans' : '');
    if (G.answered) cls += key === rightKey ? ' right' : key === G.picked ? ' wrong' : ' dim';
    const label = ST.mode === 'flag2cont' ? o : ST.mode === 'flag2name' ? o.name : '보기 ' + (k + 1);
    const inner = ST.mode === 'name2flag' ? `<span class="flag">${flagSVG(o.code, label)}</span>` : label;
    return `<button class="${cls}" data-key="${key}" ${G.answered ? 'disabled' : ''} aria-label="${label}">${inner}</button>`;
  }).join('');
  let fb = '';
  if (G.answered) {
    const ok = G.picked === rightKey;
    let msg;
    if (ok) msg = CHEERS[Math.floor(Math.random() * CHEERS.length)];
    else if (ST.mode === 'flag2name') msg = `아쉬워요! 정답은 ${t.name}`;
    else if (ST.mode === 'name2flag') msg = `아쉬워요! 그건 ${BY[G.picked].name} 국기예요`;
    else msg = `아쉬워요! 정답은 ${t.cont}`;
    fb = `<div class="feedback ${ok ? 'good' : 'bad'}" role="status">
      <div class="msg"><b>${msg}</b><span class="fact">${ST.mode==='flag2cont' ? `이 국기는 ${t.name} 국기예요. ` : ''}${t.name}${josa(t.name,'은','는')} ${t.cont}에 있고, 수도는 ${t.capital}${josa(t.capital,'이에요','예요')}.</span></div>
      <button class="next" id="next">${G.i + 1 < G.total ? '다음 문제' : '결과 보기'}</button></div>`;
  }
  const tag = `${ST.mode==='flag2cont' ? '대륙 맞히기' : contOf()} · ${LEVELS[ST.level].name}`;
  $('#app').innerHTML = topBar() + `
  <div class="status"><div class="trail" aria-label="${G.i + 1}번째 문제 / ${G.total}문제">${trail}</div>
    <div class="score">점수 ${G.score}${G.streak >= 2 ? `<span class="streak">${G.streak}연속!</span>` : ''}</div></div>
  <section class="stage"><span class="chip">${tag}</span>${prompts[ST.mode]}</section>
  <div class="answers${ST.mode==='flag2cont' ? ' conts' : ''}">${answers}</div>${fb}
  <button class="ghost" id="quit">처음으로</button>`;
  document.querySelectorAll('.ans').forEach(b => b.onclick = () => answer(b.dataset.key));
  if ($('#next')) { $('#next').onclick = nextQ; $('#next').focus({ preventScroll: true }); }
  $('#quit').onclick = () => { ST.view = 'home'; renderHome(); };
  bindSound();
}

function answer(key) {
  if (G.answered) return;
  const t = G.qs[G.i];
  const ok = key === (ST.mode === 'flag2cont' ? t.cont : t.code);
  G.answered = true; G.picked = key; G.results.push(ok);
  if (ok) {
    G.streak++;
    const pts = ST.mode === 'flag2cont' ? (ST.level === 'hard' ? 20 : 10) : LEVELS[ST.level].pts;
    G.score += pts + (G.streak >= 3 ? 5 : 0);
    if (!ST.seen.includes(t.code)) { ST.seen.push(t.code); store.set('fq-seen', ST.seen); }
  } else { G.streak = 0; G.missed.push(t); }
  beep(ok);
  renderPlay();
}
function nextQ() {
  G.i++;
  if (G.i >= G.total) { ST.view = 'result'; renderResult(); return; }
  makeQuestion(); renderPlay();
}

function renderResult() {
  const right = G.results.filter(Boolean).length;
  const ratio = right / G.total;
  const stars = ratio === 1 ? 3 : ratio >= .7 ? 2 : ratio >= .4 ? 1 : 0;
  const k = bestKey(), prev = ST.best[k] || 0;
  const newBest = G.score > prev;
  if (newBest) { ST.best[k] = G.score; store.set('fq-best2', ST.best); }
  const line = ['다시 해 보면 더 잘할 수 있어요!','좋은 출발이에요!','정말 잘했어요!','모두 맞혔어요! 국기 박사님!'][stars];
  const up = stars === 3 && ST.level !== 'hard' ? `<p>다음엔 '${LEVELS[ST.level === 'easy' ? 'normal' : 'hard'].name}' 단계에 도전해 볼까요?</p>` : '';
  $('#app').innerHTML = topBar() + `
  <section class="result">
    <div class="stars" aria-label="별 ${stars}개">${[0,1,2].map(i => `<span class="${i < stars ? '' : 'off'}">★</span>`).join('')}</div>
    <div class="big">${right} / ${G.total}</div>
    <h2 style="font-size:1.6rem">${line}</h2>
    <p>점수 ${G.score}점${newBest ? ' · 새 최고 기록!' : ` · 최고 기록 ${prev}점`}</p>${up}
  </section>
  ${G.missed.length ? `<div><div class="label">다시 한번 기억해요</div><div class="missed">${G.missed.map(c => `<figure><div class="flag">${flagSVG(c.code, c.name)}</div><figcaption>${c.name}<small>${c.cont}</small></figcaption></figure>`).join('')}</div></div>` : ''}
  <div class="row"><button class="go" id="again">한 번 더!</button><button class="ghost" id="home">처음으로</button></div>`;
  $('#again').onclick = startGame;
  $('#home').onclick = () => { ST.view = 'home'; renderHome(); };
  bindSound();
}

function renderDex() {
  const list = COUNTRIES.filter(c => ST.dexCont === '전체' || c.cont === ST.dexCont);
  $('#app').innerHTML = topBar() + `
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
    <h2 style="font-size:1.6rem">국기 도감</h2><button class="ghost" id="home" style="padding:8px 16px">처음으로</button></div>
  <p class="note">초록 테두리는 게임에서 맞힌 국기예요. ${ST.seen.length} / ${COUNTRIES.length}개 모았어요.</p>
  <div class="tabs">${['전체', ...CONTS].map(k => `<button class="tab" data-c="${k}" aria-pressed="${ST.dexCont===k}">${k}</button>`).join('')}</div>
  <div class="dex">${list.map(c => `<figure class="${ST.seen.includes(c.code) ? 'seen' : ''}"><div class="flag">${flagSVG(c.code, c.name)}</div><figcaption>${c.name}<small>수도 ${c.capital}</small></figcaption></figure>`).join('')}</div>`;
  document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { ST.dexCont = b.dataset.c; renderDex(); });
  $('#home').onclick = () => { ST.view = 'home'; renderHome(); };
  bindSound();
}

renderHome();

</script>

</body>
</html>
