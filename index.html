<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>꼬마 국기 탐험대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one centered play column; a "flagpole" stage on top, big answer tiles below, dot trail for progress */
:root {
  --bg: #E9F1F7;
  --surface: #FFFFFF;
  --ink: #1C2A3A;
  --muted: #5B6B7D;
  --line: #CBD8E4;
  --accent: #2F6FDE;
  --accent-ink: #FFFFFF;
  --sun: #FFC93C;
  --good: #1E9E5A;
  --good-bg: #DDF5E7;
  --bad: #D9443A;
  --bad-bg: #FBE3E0;
  --pole: #9AA9B8;
  --display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121B26; --surface: #1C2836; --ink: #EAF1F8; --muted: #9FB0C2; --line: #2F3F51;
  --accent: #6FA0FF; --accent-ink: #0E1724; --sun: #FFD266; --good: #4FD18B; --good-bg: #173A2A;
  --bad: #FF7A70; --bad-bg: #42201E; --pole: #56677A; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121B26; --surface: #1C2836; --ink: #EAF1F8; --muted: #9FB0C2; --line: #2F3F51;
  --accent: #6FA0FF; --accent-ink: #0E1724; --sun: #FFD266; --good: #4FD18B; --good-bg: #173A2A;
  --bad: #FF7A70; --bad-bg: #42201E; --pole: #56677A; color-scheme: dark; }
html, body { min-height: 100%; }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
img { max-width: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; word-break: keep-all; }
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, .display { font-family: var(--display); font-weight: 400; text-wrap: balance; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.flag > svg { display: block; width: 100%; height: auto; border-radius: 4px; box-shadow: 0 0 0 1px rgba(0,0,0,.12); }

/* Top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 { font-size: 1.6rem; }
.brand .mini { width: 34px; }
.iconbtn { background: var(--surface); border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; font-family: var(--display); font-size: 1rem; }

/* Home */
.hero { background: var(--surface); border-radius: 22px; padding: 22px; display: grid; gap: 16px; border: 2px solid var(--line); }
.hero p { margin: 0; color: var(--muted); line-height: 1.6; }
.parade { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.label { font-family: var(--display); font-size: 1.05rem; margin-bottom: 8px; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 14px; text-align: left; display: grid; gap: 4px; }
.opt b { font-family: var(--display); font-weight: 400; font-size: 1.2rem; }
.opt span { color: var(--muted); font-size: .9rem; }
.opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.go { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 18px; padding: 16px; font-family: var(--display); font-size: 1.5rem; box-shadow: 0 5px 0 color-mix(in srgb, var(--accent) 60%, #000); transition: transform .08s; }
.go:active { transform: translateY(3px); box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 60%, #000); }
.ghost { background: transparent; border: 2px solid var(--line); border-radius: 18px; padding: 12px; font-family: var(--display); font-size: 1.1rem; }

/* Play */
.status { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.trail { display: flex; gap: 6px; flex-wrap: wrap; }
.trail i { width: 16px; height: 16px; border-radius: 50%; background: var(--line); display: block; }
.trail i.ok { background: var(--good); } .trail i.no { background: var(--bad); } .trail i.now { box-shadow: 0 0 0 3px var(--accent); background: var(--surface); }
.score { font-family: var(--display); font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.score .streak { color: var(--bad); margin-left: 8px; }
.stage { position: relative; background: var(--surface); border-radius: 22px; border: 2px solid var(--line); padding: 22px 22px 22px 46px; display: grid; gap: 14px; }
.stage::before { content: ""; position: absolute; left: 24px; top: 16px; bottom: 16px; width: 6px; border-radius: 3px; background: var(--pole); }
.stage::after { content: ""; position: absolute; left: 20px; top: 10px; width: 14px; height: 14px; border-radius: 50%; background: var(--sun); }
.q { font-family: var(--display); font-size: 1.35rem; }
.bigflag { max-width: 420px; transform-origin: left center; animation: raise .5s ease-out; }
.bigname { font-family: var(--display); font-size: clamp(2.2rem, 9vw, 3.4rem); color: var(--accent); animation: raise .5s ease-out; }
.still { animation: none; }
@keyframes raise { from { transform: translateY(18px); opacity: .3; } to { transform: none; opacity: 1; } }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ans { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 16px 10px; font-family: var(--display); font-size: 1.35rem; min-height: 64px; box-shadow: 0 4px 0 var(--line); transition: transform .08s; }
.ans:hover:not(:disabled) { border-color: var(--accent); }
.ans:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 var(--line); }
.ans.flagans { padding: 10px; }
.ans.right { background: var(--good-bg); border-color: var(--good); box-shadow: 0 4px 0 var(--good); animation: pop .35s; }
.ans.wrong { background: var(--bad-bg); border-color: var(--bad); box-shadow: 0 4px 0 var(--bad); animation: shake .35s; }
.ans:disabled { cursor: default; }
.ans.dim { opacity: .45; }
@keyframes pop { 50% { transform: scale(1.06); } }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.feedback { border-radius: 18px; padding: 14px 16px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.feedback.good { background: var(--good-bg); } .feedback.bad { background: var(--bad-bg); }
.feedback .msg { display: grid; gap: 4px; min-width: 0; }
.feedback .msg b { font-family: var(--display); font-weight: 400; font-size: 1.35rem; }
.feedback.good .msg b { color: var(--good); } .feedback.bad .msg b { color: var(--bad); }
.feedback .fact { color: var(--ink); line-height: 1.5; }
.next { background: var(--ink); color: var(--bg); border: 0; border-radius: 14px; padding: 12px 20px; font-family: var(--display); font-size: 1.2rem; }

/* Result */
.result { text-align: center; display: grid; gap: 16px; background: var(--surface); border: 2px solid var(--line); border-radius: 22px; padding: 26px 20px; }
.stars { font-size: 3rem; letter-spacing: 6px; color: var(--sun); line-height: 1; }
.stars .off { color: var(--line); }
.result .big { font-family: var(--display); font-size: 2.6rem; font-variant-numeric: tabular-nums; }
.result p { margin: 0; color: var(--muted); }
.missed { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; text-align: left; }
.missed figure, .dex figure { margin: 0; display: grid; gap: 6px; }
.missed figcaption, .dex figcaption { font-family: var(--display); font-size: 1.05rem; }
.dex figcaption small { display: block; font-family: var(--body); color: var(--muted); font-size: .82rem; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.row > * { flex: 1 1 180px; }

/* Dex */
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tab { background: var(--surface); border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; font-family: var(--display); }
.tab[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.dex { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 16px; }
.dex figure { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 10px; }
.dex figure.seen { border-color: var(--good); }
.note { color: var(--muted); font-size: .92rem; margin: 0; }

@media (max-width: 420px) {
  .choices.three { grid-template-columns: 1fr; }
  .ans { font-size: 1.15rem; }
  .stage { padding: 18px 16px 18px 40px; }
  .stage::before { left: 18px; } .stage::after { left: 14px; }
}
.choices.three { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.tab small { margin-left: 6px; font-family: var(--body); opacity: .7; font-size: .8rem; }
.chip { justify-self: start; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: .85rem; color: var(--muted); }
.answers.conts .ans { font-size: 1.2rem; }
.missed figcaption small { display: block; font-family: var(--body); color: var(--muted); font-size: .82rem; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>


<div class="wrap" id="app"></div>

<script>
// Flag drawings in a 300x200 viewBox. Each returns inner SVG markup.
let __uid = 0;
const R = (x,y,w,h,f) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"/>`;
const H = (cols, weights) => { weights = weights || cols.map(()=>1); const t = weights.reduce((a,b)=>a+b,0); let y=0, s=''; cols.forEach((c,i)=>{ const h=200*weights[i]/t; s+=R(0,y,300,h+0.5,c); y+=h; }); return s; };
const V = (cols, weights) => { weights = weights || cols.map(()=>1); const t = weights.reduce((a,b)=>a+b,0); let x=0, s=''; cols.forEach((c,i)=>{ const w=300*weights[i]/t; s+=R(x,0,w+0.5,200,c); x+=w; }); return s; };
function starPts(cx, cy, r, rot = 0, n = 5, inner = 0.382) {
  const p = [];
  for (let i = 0; i < n * 2; i++) {
    const rr = i % 2 ? r * inner : r;
    const a = (rot - 90 + i * 180 / n) * Math.PI / 180;
    p.push((cx + rr * Math.cos(a)).toFixed(2) + ',' + (cy + rr * Math.sin(a)).toFixed(2));
  }
  return p.join(' ');
}
const S = (cx, cy, r, f, rot = 0, n = 5, inner) => `<polygon points="${starPts(cx, cy, r, rot, n, inner)}" fill="${f}"/>`;
const C = (cx, cy, r, f) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}"/>`;
const P = (pts, f) => `<polygon points="${pts}" fill="${f}"/>`;
function nordic(bg, cross, w, inner, iw, cx = 112) {
  let s = R(0,0,300,200,bg) + R(cx-w/2,0,w,200,cross) + R(0,100-w/2,300,w,cross);
  if (inner) s += R(cx-iw/2,0,iw,200,inner) + R(0,100-iw/2,300,iw,inner);
  return s;
}
function unionJack(x, y, w, h) {
  const a = 'uj' + (++__uid);
  return `<svg x="${x}" y="${y}" width="${w}" height="${h}" viewBox="0 0 60 30" preserveAspectRatio="none">
  <clipPath id="${a}t"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
  <rect width="60" height="30" fill="#012169"/>
  <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
  <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#${a}t)" stroke="#C8102E" stroke-width="4"/>
  <path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/>
  <path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></svg>`;
}
function taegeuk() {
  const red = '#CD2E3A', blue = '#0047A0';
  let s = R(0,0,300,200,'#fff');
  s += `<g transform="translate(150,100) rotate(33.69)">${C(0,0,50,blue)}<path d="M-50,0 A50,50 0 0,1 50,0 A25,25 0 0,0 0,0 A25,25 0 0,1 -50,0 Z" fill="${red}"/></g>`;
  const bar = (yy, broken) => broken
    ? R(-25, yy - 4.17, 20.83, 8.33, '#000') + R(4.17, yy - 4.17, 20.83, 8.33, '#000')
    : R(-25, yy - 4.17, 50, 8.33, '#000');
  const tri = (ang, pattern) => `<g transform="translate(150,100) rotate(${ang}) translate(0,-92)">${pattern.map((b, i) => bar(-12.5 + i * 12.5, b)).join('')}</g>`;
  s += tri(-56.31, [0,0,0]);        // 건 ☰
  s += tri(56.31, [1,0,1]);         // 감 ☵
  s += tri(123.69, [1,1,1]);        // 곤 ☷
  s += tri(-123.69, [0,1,0]);       // 리 ☲
  return s;
}
function mapleLeaf(cx, cy, size, f) {
  const right = [[50,2],[58,17],[67,13],[63,41],[77,26],[80,34],[94,31],[89,47],[96,51],[74,69],[77,78],[53,75],[53,97]];
  const left = right.slice().reverse().map(([x,y]) => [100-x, y]);
  const pts = right.concat(left).map(([x,y]) => ((cx - size/2 + x*size/100).toFixed(1)) + ',' + ((cy - size/2 + y*size/100).toFixed(1))).join(' ');
  return P(pts, f);
}
function usa() {
  let s = '';
  for (let i = 0; i < 13; i++) s += R(0, i*200/13, 300, 200/13 + 0.5, i % 2 ? '#fff' : '#B22234');
  s += R(0,0,120,200*7/13,'#3C3B6E');
  const ch = 200*7/13;
  for (let r = 0; r < 9; r++) {
    const cols = r % 2 ? 5 : 6;
    for (let c = 0; c < cols; c++) {
      const x = (r % 2 ? 20 : 10) + c * 20;
      const y = ch/10 * (r + 1);
      s += S(x, y, 4.6, '#fff');
    }
  }
  return s;
}
function sunRays(cx, cy, r, rays, len, f, face) {
  let s = '';
  for (let i = 0; i < rays; i++) {
    const a = i * 360 / rays;
    s += `<polygon points="${cx-2.4},${cy} ${cx+2.4},${cy} ${cx},${cy-r-len}" fill="${f}" transform="rotate(${a} ${cx} ${cy})"/>`;
  }
  return s + C(cx, cy, r, face || f);
}

const FLAGS = {
  KR: taegeuk,
  JP: () => R(0,0,300,200,'#fff') + C(150,100,60,'#BC002D'),
  CN: () => {
    const red = '#EE1C25', y = '#FFFF00';
    let s = R(0,0,300,200,red) + S(50,50,30,y);
    [[100,20],[120,40],[120,70],[100,90]].forEach(([x,yy]) => {
      const ang = Math.atan2(50-yy, 50-x) * 180/Math.PI + 90;
      s += S(x,yy,10,y,ang);
    });
    return s;
  },
  US: usa,
  GB: () => unionJack(0,0,300,200),
  FR: () => V(['#0055A4','#fff','#EF4135']),
  DE: () => H(['#000','#DD0000','#FFCE00']),
  IT: () => V(['#009246','#fff','#CE2B37']),
  CA: () => V(['#D52B1E','#fff','#D52B1E'],[1,2,1]) + mapleLeaf(150,100,118,'#D52B1E'),
  BR: () => {
    const id = 'br' + (++__uid);
    let s = R(0,0,300,200,'#009739') + P('24,100 150,17 276,100 150,183','#FEDD00');
    s += `<clipPath id="${id}"><circle cx="150" cy="100" r="52"/></clipPath>` + C(150,100,52,'#012169');
    s += `<circle cx="135" cy="215" r="128" fill="none" stroke="#fff" stroke-width="9" clip-path="url(#${id})"/>`;
    [[128,112],[142,120],[155,128],[170,118],[160,140],[135,135],[176,104],[150,145],[120,125]].forEach(([x,y]) => s += S(x,y,2.6,'#fff'));
    return s;
  },
  AU: () => {
    const w = '#fff';
    let s = R(0,0,300,200,'#012169') + unionJack(0,0,150,100);
    s += S(75,150,24,w,0,7,0.44);
    s += S(225,172,13,w,0,7,0.44) + S(225,36,13,w,0,7,0.44) + S(184,92,13,w,0,7,0.44) + S(264,80,13,w,0,7,0.44) + S(244,112,7,w);
    return s;
  },
  RU: () => H(['#fff','#0039A6','#D52B1E']),
  IN: () => {
    let s = H(['#FF9933','#fff','#138808']);
    s += `<circle cx="150" cy="100" r="27" fill="none" stroke="#000080" stroke-width="4"/>` + C(150,100,5,'#000080');
    for (let i = 0; i < 24; i++) s += `<line x1="150" y1="100" x2="150" y2="74" stroke="#000080" stroke-width="1.6" transform="rotate(${i*15} 150 100)"/>`;
    return s;
  },
  VN: () => R(0,0,300,200,'#DA251D') + S(150,100,60,'#FFFF00'),
  TH: () => H(['#A51931','#F4F5F8','#2D2A4A','#F4F5F8','#A51931'],[1,1,2,1,1]),
  CH: () => R(0,0,300,200,'#DA291C') + R(130,40,40,120,'#fff') + R(90,80,120,40,'#fff'),
  SE: () => nordic('#006AA7','#FECC02',40),
  TR: () => R(0,0,300,200,'#E30A17') + C(100,100,50,'#fff') + C(112.5,100,40,'#E30A17') + S(172,100,25,'#fff',-90),
  ES: () => H(['#AA151B','#F1BF00','#AA151B'],[1,2,1]),
  GR: () => {
    let s = '';
    for (let i = 0; i < 9; i++) s += R(0, i*200/9, 300, 200/9 + 0.5, i % 2 ? '#fff' : '#0D5EAF');
    const u = 200/9;
    s += R(0,0,5*u,5*u,'#0D5EAF') + R(2*u,0,u,5*u,'#fff') + R(0,2*u,5*u,u,'#fff');
    return s;
  },
  NO: () => nordic('#BA0C2F','#fff',50,'#00205B',25,100),
  DK: () => nordic('#C8102E','#fff',30,null,0,100),
  FI: () => nordic('#fff','#002F6C',55,null,0,105),
  IS: () => nordic('#02529C','#fff',50,'#DC1E35',25,100),
  NL: () => H(['#AE1C28','#fff','#21468B']),
  BE: () => V(['#000','#FDDA24','#EF3340']),
  IE: () => V(['#169B62','#fff','#FF883E']),
  AT: () => H(['#ED2939','#fff','#ED2939']),
  PL: () => H(['#fff','#DC143C']),
  UA: () => H(['#0057B7','#FFD700']),
  HU: () => H(['#CD2A3E','#fff','#436F4D']),
  CZ: () => H(['#fff','#D7141A']) + P('0,0 150,100 0,200','#11457E'),
  RO: () => V(['#002B7F','#FCD116','#CE1126']),
  BG: () => H(['#fff','#00966E','#D62612']),
  EE: () => H(['#0072CE','#000','#fff']),
  LT: () => H(['#FDB913','#006A44','#C1272D']),
  ID: () => H(['#CE1126','#fff']),
  PH: () => {
    const y = '#FCD116';
    let s = H(['#0038A8','#CE1126']) + P('0,0 173,100 0,200','#fff');
    for (let i = 0; i < 8; i++) s += `<polygon points="54,100 62,100 58,68" fill="${y}" transform="rotate(${i*45} 58 100)"/>`;
    s += C(58,100,17,y) + S(16,22,9,y) + S(16,178,9,y) + S(146,100,9,y,90);
    return s;
  },
  SG: () => {
    let s = H(['#EF3340','#fff']) + C(62,50,30,'#fff') + C(75,50,28,'#EF3340');
    for (let i = 0; i < 5; i++) {
      const a = (-90 + i*72) * Math.PI/180;
      s += S(88 + 15*Math.cos(a), 52 + 15*Math.sin(a), 6, '#fff');
    }
    return s;
  },
  BD: () => R(0,0,300,200,'#006A4E') + C(135,100,66,'#F42A41'),
  LA: () => H(['#CE1126','#002868','#CE1126'],[1,2,1]) + C(150,100,40,'#fff'),
  PK: () => R(0,0,300,200,'#01411C') + R(0,0,75,200,'#fff') + C(188,100,58,'#fff') + C(203,85,50,'#01411C') + S(222,68,17,'#fff',30),
  MM: () => H(['#FECB00','#34B233','#EA2839']) + S(150,108,72,'#fff'),
  NZ: () => {
    let s = R(0,0,300,200,'#012169') + unionJack(0,0,150,100);
    [[225,168,15],[225,42,14],[188,96,13],[258,84,12]].forEach(([x,y,r]) => s += S(x,y,r+3,'#fff') + S(x,y,r,'#CC142B'));
    return s;
  },
  AR: () => H(['#74ACDF','#fff','#74ACDF']) + sunRays(150,100,14,16,9,'#F6B40E'),
  CL: () => H(['#fff','#D52B1E']) + R(0,0,100,100,'#0039A6') + S(50,50,22,'#fff'),
  CO: () => H(['#FCD116','#003893','#CE1126'],[2,1,1]),
  PE: () => V(['#D91023','#fff','#D91023']),

  HN:['SO','FM','AR'], AR:['HN','UY','GT'], UY:['AR','GR'], GR:['UY','IS'], BH:['QA','MV'], MV:['BH','PK'], NR:['FM','SO'],
  CL:['CU','PA'], PA:['CL','CU'], MA:['VN','SN'], GA:['SL','RU'], MU:['GA','CO'], MM:['GH','LT'], ES:['CO','BO'], DE:['BE','LT'], BE:['DE','RO'],
  UA:['SE','PL'], PE:['AT','CA'], CA:['PE','AT'], NG:['IE','CI'], GB:['AU','NZ'], US:['LR','MY'], CH:['DK','TO'], IN:['NE','CI'],
};
const CHEERS = ['딩동댕! 정답이에요','와, 대단해요!','최고예요!','국기 박사님이네요!','완벽해요!'];

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let ST = { view: 'home', mode: 'flag2name', level: 'normal', cont: '전체', sound: store.get('fq-sound', true),
  seen: store.get('fq-seen', []), best: store.get('fq-best2', {}), dexCont: '전체' };

const $ = s => document.querySelector(s);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const josa = (w, a, b) => { const c = w.charCodeAt(w.length - 1) - 0xAC00; return (c >= 0 && c % 28) ? a : b; };
const contOf = () => ST.mode === 'flag2cont' ? '전체' : ST.cont;
function pool() {
  const cont = contOf();
  if (cont !== '전체') return COUNTRIES.filter(c => c.cont === cont);
  return ST.level === 'easy' ? COUNTRIES.filter(c => c.easy) : COUNTRIES;
}
const bestKey = () => `${ST.mode}|${ST.level}|${contOf()}`;

let audio;
function beep(ok) {
  if (!ST.sound) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const notes = ok ? [660, 880] : [300, 220];
    notes.forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = ok ? 'triangle' : 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, audio.currentTime + i * .12);
      g.gain.exponentialRampToValueAtTime(ok ? .25 : .08, audio.currentTime + i * .12 + .02);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + i * .12 + .18);
      o.connect(g).connect(audio.destination); o.start(audio.currentTime + i * .12); o.stop(audio.currentTime + i * .12 + .2);
    });
  } catch {}
}

function topBar() {
  return `<div class="top">
    <div class="brand"><div class="flag mini">${flagSVG('KR','')}</div><h1>꼬마 국기 탐험대</h1></div>
    <button class="iconbtn" id="snd" aria-pressed="${ST.sound}">${ST.sound ? '소리 켜짐' : '소리 꺼짐'}</button>
  </div>`;
}
function bindSound() {
  const b = $('#snd'); if (!b) return;
  b.onclick = () => { ST.sound = !ST.sound; store.set('fq-sound', ST.sound); b.textContent = ST.sound ? '소리 켜짐' : '소리 꺼짐'; b.setAttribute('aria-pressed', ST.sound); };
}

function renderHome() {
  const parade = shuffle(COUNTRIES).slice(0, 8);
  const contLocked = ST.mode === 'flag2cont';
  const count = k => COUNTRIES.filter(c => c.cont === k).length;
  const n = Math.min(10, pool().length);
  const best = ST.best[bestKey()];
  $('#app').innerHTML = topBar() + `
  <section class="hero">
    <div class="parade">${parade.map(c => `<div class="flag">${flagSVG(c.code, c.name)}</div>`).join('')}</div>
    <h2 style="font-size:1.7rem">세계 ${COUNTRIES.length}개 나라의 국기를 맞혀 보세요!</h2>
    <p>지금까지 <b>${ST.seen.length}개</b> 국기를 맞혔어요.</p>
  </section>
  <div>
    <div class="label">어떻게 놀까요?</div>
    <div class="choices three">
      <button class="opt" data-mode="flag2name" aria-pressed="${ST.mode==='flag2name'}"><b>국기 보고 이름 찾기</b><span>국기를 보고 나라 이름을 골라요</span></button>
      <button class="opt" data-mode="name2flag" aria-pressed="${ST.mode==='name2flag'}"><b>이름 보고 국기 찾기</b><span>나라 이름을 보고 국기를 골라요</span></button>
      <button class="opt" data-mode="flag2cont" aria-pressed="${ST.mode==='flag2cont'}"><b>어느 대륙 나라일까?</b><span>국기를 보고 대륙을 골라요</span></button>
    </div>
  </div>
  <div>
    <div class="label">어느 대륙을 탐험할까요?</div>
    ${contLocked ? `<p class="note">'어느 대륙 나라일까?'는 모든 대륙에서 문제가 나와요.</p>` : `
    <div class="tabs">${['전체', ...CONTS].map(k => `<button class="tab" data-cont="${k}" aria-pressed="${ST.cont===k}">${k}<small>${k==='전체' ? COUNTRIES.length : count(k)}</small></button>`).join('')}</div>`}
  </div>
  <div>
    <div class="label">난이도</div>
    <div class="choices three">${Object.entries(LEVELS).map(([k, L]) => `<button class="opt" data-level="${k}" aria-pressed="${ST.level===k}"><b>${L.name}</b><span>${ST.mode==='flag2cont' ? (k==='easy' ? '유명한 나라만' : k==='normal' ? '모든 나라' : '모든 나라 · 맞히면 점수 2배') : L.desc}</span></button>`).join('')}</div>
  </div>
  <button class="go" id="start">시작하기 · ${n}문제</button>
  <p class="note" style="text-align:center">${best ? `이 설정의 최고 기록은 ${best}점이에요.` : '이 설정으로는 처음 도전해요.'}</p>
  <button class="ghost" id="dex">국기 도감 보기</button>`;
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { ST.mode = b.dataset.mode; renderHome(); });
  document.querySelectorAll('[data-level]').forEach(b => b.onclick = () => { ST.level = b.dataset.level; renderHome(); });
  document.querySelectorAll('[data-cont]').forEach(b => b.onclick = () => { ST.cont = b.dataset.cont; renderHome(); });
  $('#start').onclick = startGame;
  $('#dex').onclick = () => { ST.view = 'dex'; renderDex(); };
  bindSound();
}

let G;
function startGame() {
  const p = shuffle(pool());
  const n = Math.min(10, p.length);
  G = { qs: p.slice(0, n), total: n, i: 0, score: 0, streak: 0, results: [], missed: [], answered: false };
  makeQuestion(); ST.view = 'play'; renderPlay();
  window.scrollTo(0, 0);
}
function makeQuestion() {
  const target = G.qs[G.i];
  G.answered = false; G.picked = null;
  if (ST.mode === 'flag2cont') { G.options = CONTS.slice(); return; }
  const L = LEVELS[ST.level];
  const p = pool();
  let picks = [];
  if (L.twins) {
    // look-alikes from anywhere in the world make it harder, even inside one continent
    picks = shuffle((TWINS[target.code] || []).map(k => BY[k]).filter(Boolean)).slice(0, L.twins);
    // in hard mode, prefer the same continent for the rest
    if (ST.level === 'hard') shuffle(COUNTRIES.filter(c => c.cont === target.cont && c !== target)).forEach(c => { if (picks.length < L.opts - 1 && !picks.includes(c)) picks.push(c); });
  }
  shuffle(p.filter(c => c !== target)).forEach(c => { if (picks.length < L.opts - 1 && !picks.includes(c)) picks.push(c); });
  shuffle(COUNTRIES.filter(c => c !== target)).forEach(c => { if (picks.length < L.opts - 1 && !picks.includes(c)) picks.push(c); });
  G.options = shuffle([target, ...picks]);
}

function renderPlay() {
  const t = G.qs[G.i];
  const trail = G.qs.map((_, k) => `<i class="${k < G.results.length ? (G.results[k] ? 'ok' : 'no') : (k === G.i ? 'now' : '')}"></i>`).join('');
  const still = G.answered ? ' still' : '';
  const prompts = {
    flag2name: `<div class="q">이 국기는 어느 나라일까요?</div><div class="flag bigflag${still}">${flagSVG(t.code, '문제 국기')}</div>`,
    name2flag: `<div class="q">어느 것이 이 나라의 국기일까요?</div><div class="bigname${still}">${t.name}</div>`,
    flag2cont: `<div class="q">이 국기의 나라는 어느 대륙에 있을까요?</div><div class="flag bigflag${still}">${flagSVG(t.code, '문제 국기')}</div>`,
  };
  const rightKey = ST.mode === 'flag2cont' ? t.cont : t.code;
  const answers = G.options.map((o, k) => {
    const key = ST.mode === 'flag2cont' ? o : o.code;
    let cls = 'ans' + (ST.mode === 'name2flag' ? ' flagans' : '');
    if (G.answered) cls += key === rightKey ? ' right' : key === G.picked ? ' wrong' : ' dim';
    const label = ST.mode === 'flag2cont' ? o : ST.mode === 'flag2name' ? o.name : '보기 ' + (k + 1);
    const inner = ST.mode === 'name2flag' ? `<span class="flag">${flagSVG(o.code, label)}</span>` : label;
    return `<button class="${cls}" data-key="${key}" ${G.answered ? 'disabled' : ''} aria-label="${label}">${inner}</button>`;
  }).join('');
  let fb = '';
  if (G.answered) {
    const ok = G.picked === rightKey;
    let msg;
    if (ok) msg = CHEERS[Math.floor(Math.random() * CHEERS.length)];
    else if (ST.mode === 'flag2name') msg = `아쉬워요! 정답은 ${t.name}`;
    else if (ST.mode === 'name2flag') msg = `아쉬워요! 그건 ${BY[G.picked].name} 국기예요`;
    else msg = `아쉬워요! 정답은 ${t.cont}`;
    fb = `<div class="feedback ${ok ? 'good' : 'bad'}" role="status">
      <div class="msg"><b>${msg}</b><span class="fact">${ST.mode==='flag2cont' ? `이 국기는 ${t.name} 국기예요. ` : ''}${t.name}${josa(t.name,'은','는')} ${t.cont}에 있고, 수도는 ${t.capital}${josa(t.capital,'이에요','예요')}.</span></div>
      <button class="next" id="next">${G.i + 1 < G.total ? '다음 문제' : '결과 보기'}</button></div>`;
  }
  const tag = `${ST.mode==='flag2cont' ? '대륙 맞히기' : contOf()} · ${LEVELS[ST.level].name}`;
  $('#app').innerHTML = topBar() + `
  <div class="status"><div class="trail" aria-label="${G.i + 1}번째 문제 / ${G.total}문제">${trail}</div>
    <div class="score">점수 ${G.score}${G.streak >= 2 ? `<span class="streak">${G.streak}연속!</span>` : ''}</div></div>
  <section class="stage"><span class="chip">${tag}</span>${prompts[ST.mode]}</section>
  <div class="answers${ST.mode==='flag2cont' ? ' conts' : ''}">${answers}</div>${fb}
  <button class="ghost" id="quit">처음으로</button>`;
  document.querySelectorAll('.ans').forEach(b => b.onclick = () => answer(b.dataset.key));
  if ($('#next')) { $('#next').onclick = nextQ; $('#next').focus({ preventScroll: true }); }
  $('#quit').onclick = () => { ST.view = 'home'; renderHome(); };
  bindSound();
}

function answer(key) {
  if (G.answered) return;
  const t = G.qs[G.i];
  const ok = key === (ST.mode === 'flag2cont' ? t.cont : t.code);
  G.answered = true; G.picked = key; G.results.push(ok);
  if (ok) {
    G.streak++;
    const pts = ST.mode === 'flag2cont' ? (ST.level === 'hard' ? 20 : 10) : LEVELS[ST.level].pts;
    G.score += pts + (G.streak >= 3 ? 5 : 0);
    if (!ST.seen.includes(t.code)) { ST.seen.push(t.code); store.set('fq-seen', ST.seen); }
  } else { G.streak = 0; G.missed.push(t); }
  beep(ok);
  renderPlay();
}
function nextQ() {
  G.i++;
  if (G.i >= G.total) { ST.view = 'result'; renderResult(); return; }
  makeQuestion(); renderPlay();
}

function renderResult() {
  const right = G.results.filter(Boolean).length;
  const ratio = right / G.total;
  const stars = ratio === 1 ? 3 : ratio >= .7 ? 2 : ratio >= .4 ? 1 : 0;
  const k = bestKey(), prev = ST.best[k] || 0;
  const newBest = G.score > prev;
  if (newBest) { ST.best[k] = G.score; store.set('fq-best2', ST.best); }
  const line = ['다시 해 보면 더 잘할 수 있어요!','좋은 출발이에요!','정말 잘했어요!','모두 맞혔어요! 국기 박사님!'][stars];
  const up = stars === 3 && ST.level !== 'hard' ? `<p>다음엔 '${LEVELS[ST.level === 'easy' ? 'normal' : 'hard'].name}' 단계에 도전해 볼까요?</p>` : '';
  $('#app').innerHTML = topBar() + `
  <section class="result">
    <div class="stars" aria-label="별 ${stars}개">${[0,1,2].map(i => `<span class="${i < stars ? '' : 'off'}">★</span>`).join('')}</div>
    <div class="big">${right} / ${G.total}</div>
    <h2 style="font-size:1.6rem">${line}</h2>
    <p>점수 ${G.score}점${newBest ? ' · 새 최고 기록!' : ` · 최고 기록 ${prev}점`}</p>${up}
  </section>
  ${G.missed.length ? `<div><div class="label">다시 한번 기억해요</div><div class="missed">${G.missed.map(c => `<figure><div class="flag">${flagSVG(c.code, c.name)}</div><figcaption>${c.name}<small>${c.cont}</small></figcaption></figure>`).join('')}</div></div>` : ''}
  <div class="row"><button class="go" id="again">한 번 더!</button><button class="ghost" id="home">처음으로</button></div>`;
  $('#again').onclick = startGame;
  $('#home').onclick = () => { ST.view = 'home'; renderHome(); };
  bindSound();
}

function renderDex() {
  const list = COUNTRIES.filter(c => ST.dexCont === '전체' || c.cont === ST.dexCont);
  $('#app').innerHTML = topBar() + `
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
    <h2 style="font-size:1.6rem">국기 도감</h2><button class="ghost" id="home" style="padding:8px 16px">처음으로</button></div>
  <p class="note">초록 테두리는 게임에서 맞힌 국기예요. ${ST.seen.length} / ${COUNTRIES.length}개 모았어요.</p>
  <div class="tabs">${['전체', ...CONTS].map(k => `<button class="tab" data-c="${k}" aria-pressed="${ST.dexCont===k}">${k}</button>`).join('')}</div>
  <div class="dex">${list.map(c => `<figure class="${ST.seen.includes(c.code) ? 'seen' : ''}"><div class="flag">${flagSVG(c.code, c.name)}</div><figcaption>${c.name}<small>수도 ${c.capital}</small></figcaption></figure>`).join('')}</div>`;
  document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { ST.dexCont = b.dataset.c; renderDex(); });
  $('#home').onclick = () => { ST.view = 'home'; renderHome(); };
  bindSound();
}

renderHome();

</script>

</body>
</html>
